<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Reporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0e4886; }
    .glass-dark { background:rgba(84,86,223,0.75); }
  </style>
</head>
<body class="flex min-h-screen">
  <!-- ==================== BARRA LATERAL (SIDEBAR) ==================== -->
  <aside class="w-64 bg-ocean/90 p-6">
    <h2 class="text-2xl text-cyan-400">Admin</h2>
    <nav aria-label="Menú principal" class="mt-6 space-y-2">
      <a href="dashboard.html" class="block py-2">Dashboard</a>
      <a href="reportes.html" class="block py-2">Reportes</a>
      <a href="reporte_nuevo.html" class="block py-2 bg-cyan-500/20 rounded-lg">+ Nuevo</a>
      <a href="login.html" class="block py-2 text-red-400 mt-10">Salir</a>
    </nav>
  </aside>

  <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
  <main class="flex-1 p-8">
    <!-- Encabezado de la página -->
    <header>
      <h1 class="text-3xl font-bold text-white mb-6">Crear Reporte</h1>
    </header>

    <!-- ==================== SECCIÓN: FORMULARIO DE CREACIÓN ==================== -->
    <section aria-labelledby="form-nuevo">
      <h2 id="form-nuevo" class="sr-only">Formulario para crear reporte</h2>
      <div class="glass-dark p-8 rounded-2xl max-w-2xl">
        <!-- Formulario con method POST y campo hidden para identificar operación CRUD -->
        <form action="reportes.html" method="POST">
          <!-- Campo hidden: indica que es una operación de CREACIÓN -->
          <input type="hidden" name="accion" value="crear">

          <!-- Select: Tipo de problema -->
          <div class="mb-4">
            <label for="tipo" class="block text-white mb-1">Tipo</label>
            <select id="tipo" name="tipo" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white">
              <option>Bache</option>
              <option>Alumbrado</option>
              <option>Basura</option>
            </select>
          </div>

          <!-- Input text: Ubicación del problema -->
          <div class="mb-4">
            <label for="ubicacion" class="block text-white mb-1">Ubicación</label>
            <input id="ubicacion" type="text" name="ubicacion" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white" required>
          </div>

          <!-- Textarea: Descripción detallada -->
          <div class="mb-4">
            <label for="descripcion" class="block text-white mb-1">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white" required></textarea>
          </div>

          <!-- Select: Estado del reporte -->
          <div class="mb-4">
            <label for="estado" class="block text-white mb-1">Estado</label>
            <select id="estado" name="estado" class="w-full p-3 rounded-xl bg-white/10 border border-white/20 text-white">
              <option>Pendiente</option>
              <option>En proceso</option>
              <option>Resuelto</option>
            </select>
          </div>

          <!-- Botón Guardar (type="submit") y enlace Cancelar -->
          <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 px-6 py-2 rounded-xl font-bold">Guardar</button>
          <a href="reportes.html" class="ml-4 text-gray-400">Cancelar</a>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
